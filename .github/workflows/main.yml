name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Build solution
        run: dotnet build src/Biblia/Biblia.sln --configuration Release

  teste-api:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Testes da API
        run: dotnet test testes/Biblia.API.Tests/Biblia.API.Tests.csproj --configuration Release --verbosity minimal

  teste-app:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Testes da aplicação
        run: dotnet test testes/Biblia.App.Tests/Biblia.App.Tests.csproj --configuration Release --verbosity minimal

  teste-dominio:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x
      - name: Testes do domínio
        run: dotnet test testes/Biblia.Domain.Tests/Biblia.Domain.Tests.csproj --configuration Release --verbosity minimal

  deploy:
    runs-on: ubuntu-latest
    needs: [build, teste-api, teste-app, teste-dominio]
    timeout-minutes: 20
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.x

      - name: Publish API
        run: dotnet publish src/Biblia/Biblia.API/Biblia.API.csproj --configuration Release --output ./Release -p:DebugType=None -p:DebugSymbols=false

      - name: Validate deployment secrets
        shell: bash
        env:
          BIBLIA_CONNECTION: ${{ secrets.MARCIOCOSTA_BIBLIA_CONNECTION }}
          FTP_HOST: ${{ secrets.MARCIOCOSTA_FTP_HOST }}
          FTP_USER: ${{ secrets.MARCIOCOSTA_FTP_USER }}
          FTP_PASS: ${{ secrets.MARCIOCOSTA_FTP_PASS }}
        run: |
          : "${BIBLIA_CONNECTION:?Missing MARCIOCOSTA_BIBLIA_CONNECTION secret}"
          : "${FTP_HOST:?Missing MARCIOCOSTA_FTP_HOST secret}"
          : "${FTP_USER:?Missing MARCIOCOSTA_FTP_USER secret}"
          : "${FTP_PASS:?Missing MARCIOCOSTA_FTP_PASS secret}"
          test -f ./Release/appsettings.json

      - name: Configure production connection string
        shell: bash
        env:
          BIBLIA_CONNECTION: ${{ secrets.MARCIOCOSTA_BIBLIA_CONNECTION }}
        run: |
          jq \
            --arg conn "$BIBLIA_CONNECTION" \
            '.ConnectionStrings.BibliaConn = $conn' \
            ./Release/appsettings.json > ./Release/appsettings.json.tmp
          mv ./Release/appsettings.json.tmp ./Release/appsettings.json

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: ${{ secrets.MARCIOCOSTA_FTP_HOST }}
          username: ${{ secrets.MARCIOCOSTA_FTP_USER }}
          password: ${{ secrets.MARCIOCOSTA_FTP_PASS }}
          protocol: ftp
          port: 21
          local-dir: ./Release/
          server-dir: www/api-biblia/
          dangerous-clean-slate: false

      - name: Verify API health
        shell: bash
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          for attempt in 1 2 3; do
            echo "Health check attempt ${attempt}/3: https://api-biblia.marciocosta.eti.br/health"

            if http_status=$(curl --location --silent --show-error \
              --output "$response_file" \
              --write-out '%{http_code}' \
              'https://api-biblia.marciocosta.eti.br/health'); then
              curl_exit=0
            else
              curl_exit=$?
            fi

            echo "Response body:"
            if [ -s "$response_file" ]; then
              cat "$response_file"
            else
              echo "<empty>"
            fi
            echo
            echo "HTTP status: ${http_status:-unavailable}; curl exit code: ${curl_exit}"

            if [ "$curl_exit" -eq 0 ] && [ "$http_status" = "200" ] \
              && jq -e '
                type == "object" and
                .status == "Healthy" and
                (.totalDuration | type == "string") and
                (.entries | type == "object") and
                (.entries.BancoDeDados | type == "object") and
                .entries.BancoDeDados.status == "Healthy" and
                (.entries.BancoDeDados.duration | type == "string") and
                (.entries.BancoDeDados.tags | type == "array") and
                (.entries.BancoDeDados.data | type == "object")
              ' "$response_file" > /dev/null; then
              echo "Health check passed."
              exit 0
            fi

            echo "Health check did not return the expected healthy response."
            if [ "$attempt" -lt 3 ]; then
              delay=2
              if [ "$attempt" -eq 2 ]; then
                delay=5
              fi
              echo "Retrying in ${delay} seconds..."
              sleep "$delay"
            fi
          done

          echo "Health check failed after 3 attempts."
          exit 1
